spring.application.name=quizbot-backend
server.port=8080

#openrouter configuration
openrouter.api.key={$OPENROUTER_API_KEY}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.model=google/gemma-4-26b-a4b-it:free
openrouter.fallback-models=google/gemma-4-31b-it:free,openrouter/free

#database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/quizbot
spring.datasource.username=postgres
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#oauth configs
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}